[project]
name = "bonsai-demo"
version = "0.1.0"
description = "Serve Bonsai 2 27B on Apple Silicon as an OpenAI-compatible local API"
requires-python = ">=3.9"
# The only runtime dependency in this repo, and only for ollama_bridge.py (the
# Ollama-API bridge); the Splash engine ships its own Python runtime via Homebrew.
# scripts/benchmark.py is standard library only.
dependencies = [
    "httpx>=0.27",
]

# Optional extras. `embeddings` installs mlx-vlm, which powers the optional
# /v1/embeddings service (embeddings_service.py, EmbeddingGemma 2 text-only
# 270M on the Metal GPU). mlx-vlm 0.7.6 lacks the EmbeddingGemma 2 model type,
# so this pins a git commit (0.7.7-dev) that added it natively; requires
# Python >= 3.10 (the checked-in .venv is 3.11).
[project.optional-dependencies]
embeddings = [
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm@fec3f50379bb2cb0760ef3c8a68ebce9585e4d97",
]

[tool.setuptools]
packages = []